# Negociación de contenido: los agentes pueden pedir text/markdown.
map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}

map "$wants_markdown$uri" $markdown_variant {
    default "";
    "~^1/$"          "/index.md";
    "~^1/about/?$"   "/about.md";
    "~^1/contact/?$" "/contact.md";
    "~^1/privacy/?$" "/privacy.md";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Habilitar compresión GZIP para mejor rendimiento web
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/markdown application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Enrutamiento principal
    location / {
        # Servir la variante markdown a los agentes que la piden (ver Vary: Accept)
        if ($markdown_variant) {
            rewrite ^ $markdown_variant last;
        }

        # 404 real para rutas inexistentes: nunca devolver el shell con 200.
        try_files $uri $uri/ =404;

        add_header Vary "Accept" always;
    }

    # Archivos markdown: media type correcto para la negociación.
    location ~* \.md$ {
        types { }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Vary "Accept" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # Caché agresiva para assets estáticos de Astro (CSS, JS, imágenes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Página 404 con estado HTTP real; el cuerpo es markdown si el cliente lo acepta.
    error_page 404 @not_found;
    location @not_found {
        if ($wants_markdown) {
            rewrite ^ /404.md last;
        }
        rewrite ^ /404.html last;
    }
}
